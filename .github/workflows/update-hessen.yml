name: Hessen-Baustellen aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    paths:
      - 'tools/update_hessen.py'
      - '.github/workflows/update-hessen.yml'

permissions:
  contents: write

concurrency:
  group: hessen-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Repository holen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aktuelle amtliche Hessen-Daten abholen
        run: python3 tools/update_hessen.py
      - name: Daten für GitHub Pages veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update Hessen public traffic snapshots"
            git push
          fi
